<!DOCTYPE html>
<html lang="en">
<head>
    <title>cw</title>

    <style>
        p {
            width: 300px;
            height: 100px;
            padding: 20px;
            border: 5px solid black;
        }

        .first {
            background-color: rgb(72, 209, 255);
            box-sizing: content-box;
        }

        .second {
            background-color: rgb(29, 75, 29);
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <p class="first">
        პირველი პარაგრაფი — content-box
    </p>

    <p class="second">
        მეორე პარაგრაფი — border-box
    </p>

</body>
</html>
