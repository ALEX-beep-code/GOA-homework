<html>
  <head>
    <title>shadows</title>
    <style>
      body {
        background-color: rgb(52, 48, 48)
      }
      p {
        color: white;
        font-size: 60px;
        text-align: center;
      }
      .dracula {
        text-shadow:
          0px 0px 0px rgb(35, 57, 152),
          2px 2px 0px rgb(35, 57, 152),
          4px 4px 0px rgb(35, 57, 152),
          6px 6px 0px rgb(35, 57, 152),
          8px 8px 0px rgb(35, 57, 152),
          10px 10px 0px rgb(35, 57, 152),
          12px 12px 0px rgb(0, 0, 0);
      }
      .flame {
        text-shadow:
          0px -1px 10px rgb(255, 166, 0),
          0px -2px 12px rgb(255, 145, 0),
          0px -3px 14px rgb(255, 119, 0),
          0px -4px 16px rgb(255, 119, 0),
          0px -5px 18px rgb(255, 68, 0),
          0px -5px 20px rgb(255, 30, 0),
          0px -6px 30px rgb(255, 0, 0);
      }
      .Comic {
        text-shadow:
          1px 1px 0px rgb(35, 57, 152),
          2px 2px 0px rgb(34, 59, 174),
          3px 3px 0px rgb(34, 65, 204),
          4px 4px 0px rgb(24, 61, 227),
          5px 5px 0px rgb(0, 47, 255),
          6px 6px 0px rgb(35, 57, 152),
          7px 7px 0px rgb(35, 57, 152),
          8px 8px 0px rgb(0, 0, 0);
      }
      .Ghost {
        text-shadow: 4px -4px 0px rgb(156, 141, 141);
      }
      .Vegas {
        text-shadow:
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197),
          0px 0px 20px rgb(197, 63, 197);
      }
      .Outline {
        color: white;
        text-shadow:
          -1px -1px 0 #000,
          1px -1px 0 #000,
          -1px 1px 0 #000,
          1px 1px 0 #000;
      }
      .Neon {
        text-shadow: 
          0px 0px 20px rgb(60, 255, 0),
          0px 0px 20px rgb(60, 255, 0),
          0px 0px 20px rgb(60, 255, 0),
          0px 0px 20px rgb(60, 255, 0),
          0px 0px 20px rgb(60, 255, 0),
          0px 0px 20px rgb(60, 255, 0);
      } 
      .Blueglow {
        text-shadow: 
          0px 0px 20px rgb(17, 170, 216),
          0px 0px 20px rgb(17, 170, 216),
          0px 0px 20px rgb(17, 170, 216);
      } 
      .Softshadow {
        text-shadow: 
        3px 3px 0px rgb(127, 110, 110);
      }
      .Sharpshadow {
        text-shadow: 
        3px 3px 0px rgb(217, 28, 28);
      }
      .retro3D {
        text-shadow: 
        3px 2px 0px rgb(76, 69, 69);
      }
      .RGBglitch {
        text-shadow: 
        -2px 0px 0px rgb(255, 0, 0),
        2px 0px 0px rgb(70, 173, 191),
        0px 0px 5px white;
      }
      .Raisedtext {
        text-shadow: 
        2px 1px 1px rgb(157, 152, 152);
      }
      .Embossed {
        text-shadow: 
        1px -2px 0px black;
      }
      .Cinematicdepth {
        text-shadow: 
        0px 0px 10px black;
      }
    </style>
  </head>
  <body>
    <p class="Comic">Comic</p>
    <p class="Dracula">Dracula</p>
    <p class="flame">Flame</p>
    <p class="Ghost">Ghost</p>
    <p class="Vegas">Vegas</p>
    <p class="Outline">Outline</p>
    <p class="Neon">Neon</p>
    <p class="Softshadow">Soft shadow</p>
    <p class="Sharpshadow">Sharp shadow</p>
    <p class="Blueglow">Blue glow</p>
    <p class="retro3D">Retro 3D</p>
    <p class="RGBglitch">RGB glitch</p>
    <p class="Raisedtext">Raised text</p>
    <p class="Embossed">Embossed</p>
    <p class="Cinematicdepth">Cinematic depth</p>
  </body>
</html>
