<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 70px;
        background-color: #08070b;
      }
      .card {
        background-color: #24232c;
        width: 343px;
        height: 423px;
        padding: 16px;
        display: flex;
        flex-direction: column;
      }

      .lengther {
        display: flex;
        justify-content: space-between;
        align-items: center;
        width: 100%;
      }

      .ten {
        font-weight: 700;
        font-size: 24px;
        color: #a4ffaf;
      }

      .carlent {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 16px;
        color: #e6e5ea;
      }

      .barer {
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 28px;
        margin-top: 16px;
      }

      .ball {
        background-color: white;
        width: 28px;
        height: 28px;
        border-radius: 50%;
      }

      .barhalf1 {
        width: 50%;
        height: 8px;
        background-color: #a4ffaf;
      }

      .barhalf2 {
        width: 50%;
        height: 8px;
        background-color: #18171f;
      }

      .check {
        width: 20px;
        height: 20px;
        accent-color: #a4ffaf;
      }

      label {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 16px;
      }

      .txt {
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 16px;
        color: #e6e5ea;
      }

      .lastbar {
        background-color: #18171f;
        width: 100%;
        height: 56px;
        display: flex;
        gap: 8px;
        align-items: center;
        margin-top: 32px;
        padding: 16px;
      }

      .strength {
        font-weight: 700;
        font-size: 16px;
        color: #817d92;
      }

      .baro {
        display: flex;
        flex-direction: column;
        width: 100%;
      }

      button {
        width: 100%;
        height: 56px;
        margin-top: 16px;
      }
      .medo {
        color: #e6e5ea;
        font-weight: 700;
        font-size: 16px;
        margin-left: 90px;
        margin-right: 16px;
      }
      .squarer {
        width: 10px;
        height: 28px;
        background-color: #f8cd65;
      }
      .squarer2 {
        width: 10px;
        height: 28px;
        border: 2px solid #e6e5ea;
      }
      .Generator {
        width: 100%;
      }
      .genbut {
        background-color: #a4ffaf;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 16px;
      }
      .arrow {
        width: 16px;
        height: 16px;
      }
      .halfcopbar {
        margin-top: 19px;
        margin-bottom: 19px;
        display: flex;
        height: 64px;
        justify-content: space-between;
        align-items: center;
        background-color: #24232c;
        width: 343px;
      }
      .copmige {
        width: 21px;
        height: 24px;
        margin-right: 24px;
      }
      .pttext {
        font-weight: bold;
        color: #e6e5ea;
        font-size: 32px;
        margin-left: 24px;
      }
      @media (min-width: 1440px) {
        body {
          margin-top: 0;
          min-height: 1024px;
        }

        .halfcopbar {
          width: 500px;
          height: 80px;
          margin-top: 0;
          margin-bottom: 24px;
        }

        .pttext {
          font-size: 32px;
        }

        .card {
          width: 500px;
          height: 600px;
          padding: 32px;
        }

        .carlent {
          font-size: 18px;
        }

        .ten {
          font-size: 32px;
        }

        .barer {
          height: 32px;
          margin-top: 24px;
        }

        .ball {
          width: 32px;
          height: 32px;
        }

        label {
          margin-top: 24px;
        }

        .lastbar {
          height: 56px;
          margin-top: 32px;
        }

        .medo {
          margin-left: auto;
        }

        .genbut {
          height: 64px;
          margin-top: 24px;
        }

        .arrow {
          top: auto;
          left: auto;
        }
      }
    </style>
  </head>
  <body>
    <div>
      <div class="halfcopbar">
        <h2 class="pttext">PTX1f5DaFX</h2>
        <img
          class="copmige"
          src="./day 73/cw-hw/assets/images/icon-copy.svg"
          alt="copy"
        />
      </div>
      <div class="card">
        <div class="baro">
          <div class="lengther">
            <h2 class="carlent">Character Length</h2>
            <p class="ten">10</p>
          </div>

          <div class="barer">
            <div class="barhalf1"></div>
            <div class="ball"></div>
            <div class="barhalf2"></div>
          </div>
        </div>

        <form>
          <label>
            <input type="checkbox" checked class="check" />
            <p class="txt">Include Uppercase Letters</p>
          </label>

          <label>
            <input type="checkbox" checked class="check" />
            <p class="txt">Include Lowercase Letters</p>
          </label>

          <label>
            <input type="checkbox" checked class="check" />
            <p class="txt">Include Numbers</p>
          </label>

          <label>
            <input type="checkbox" checked class="check" />
            <p class="txt">Include Symbols</p>
          </label>
        </form>

        <div class="lastbar">
          <h2 class="strength">Strength</h2>
          <h2 class="medo">Medium</h2>
          <div class="squarer"></div>
          <div class="squarer"></div>
          <div class="squarer"></div>
          <div class="squarer2"></div>
        </div>

        <div class="Generator">
          <button class="genbut">
            Generate
            <img
              class="arrow"
              src="/day 73/cw-hw/assets/images/icon-arrow-right.svg"
              alt="icon-arrow-right"
            />
          </button>
        </div>
      </div>
    </div>
  </body>
</html>
