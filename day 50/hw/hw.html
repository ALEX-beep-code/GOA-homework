<html>
  <head>
    <title>hw</title>

    <style>
        a:hover {
            color: rgb(97, 17, 17);
        }
        a:visited {
            color: aqua;
        }
        a:active {
            color: green;
        }
        a:link {
            text-decoration: none;
        }
    </style>

  </head>
  <body>
    <!--1) ახსენით რას ნიშნავს a:link, a:visited, a:hover და a:active-->

    <!--a:link — სტილი როცა ლინკი ჯერ არ არის გახსნილი.
    a:visited — სტილი როცა ლინკი უკვე გახსნილია.
    a:hover — სტილი როცა მაუსი ლინკზეა მიყვანილი.
    a:active — სტილი როცა ლინკზე დაჭერის პროცესში ხარ (დაჭერილია).-->

    <!--2) ახსენით რა განსხვავებაა a:hover და a:active შორის-->

    <!--a:hover — მოქმედებს, როცა მაუსი ლინკზეა მიყვანილი. a:active — მოქმედებს,
    როცა ლინკს აჭერ (მაუსის ღილაკი დაჭერილია).-->

    <!-- 3) ახსენით როდის მუშაობს a:link და როდის a:visited -->

    <!-- a:link — მუშაობს, როცა ლინკი ჯერ არ არის გახსნილი. a:visited — მუშაობს, როცა
    ლინკი უკვე გახსნილია (ნანახია). -->

    <!-- 4) შექმენით ვებსაიტი რომელშიც იქნება მინიმუმ 5 ბმული. თითოეულ ბმულზე
    გამოიყენეთ: - a:link - a:visited - a:hover - a:active -->

    <a href="">link1</a>
    <a href="">link2</a>
    <a href="">link3</a>
    <a href="">link4</a>
    <a href="">link5</a>



  </body>
</html>
