<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statistics</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #f0f0f0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .firsthalf {
        display: flex;
        width: 368px;
        height: 512px;
        border-radius: 32px;
        background: linear-gradient(
          180deg,
          #7755ff 0%,
          #6943ff 0.01%,
          #2f2ce9 100%
        );
        flex-direction: column;
      }

      .secondhalf {
        display: flex;
        width: 736px;
        height: 512px;
        border-radius: 32px;
        background-color: #ffffff;
      }

      .yourresult {
        font-weight: 700;
        color: #cac9ff;
        font-size: 24px;
        align-self: center;
        justify-self: start;
        margin-top: 38px;
        margin-bottom: 35px;
      }

      .svsx {
        display: flex;
        align-self: center;
        box-sizing: border-box;
        width: 200px;
        padding: 60px;
        height: 200px;
        background: linear-gradient(
          180deg,
          #4d21c9 0%,
          rgba(63, 33, 201, 0.641249) 35.88%,
          rgba(37, 33, 201, 0) 100%,
          rgba(37, 33, 201, 0) 100%
        );
        border-radius: 50%;
      }

      .svsx2 {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-self: center;
        margin-left: 15px;
      }

      .svsx2 :first-child {
        font-size: 50px;
        color: white;
        font-weight: bolder;
      }

      .svsx2 :last-child {
        color: gray;
      }

      .Great {
        align-self: center;
        font-weight: 700;
        font-style: Bold;
        font-size: 32px;
        line-height: 100%;
        letter-spacing: 0px;
        text-align: center;
        color: #ffffff;
        width: 83;
        height: 42;
        left: 86px;
        opacity: 1;
        margin-top: 28px;
      }

      .perf {
        width: 260;
        height: 134;
        top: 577px;
        left: 395px;
        opacity: 1;
        align-self: center;
        color: rgb(214, 214, 214);
        margin: 54px;
        font-family: Hanken Grotesk;
        font-weight: 500;
        font-style: Medium;
        font-size: 21px;
        line-height: 100%;
        letter-spacing: 0px;
        text-align: center;
        margin-top: 30px;
      }

      .flexer {
        display: flex;
        flex-direction: column;
        justify-content: start;
        margin-left: 40px;
      }

      .summary {
        margin-top: 38px;
        margin-bottom: 28px;
        font-weight: 700;
        color: #303b59;
        font-size: 24px;
      }
      .bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        width: 288px;
        height: 35px;
        opacity: 1;
        top: 486px;
        left: 749px;
        background-color: #fffcfc;
        padding-left: 7px;
        padding-right: 7px;
        border-radius: 15px;
        padding-top: 17px;
        padding-bottom: 17px;
      }
      .vis {
        background-color: rgb(205, 210, 255);
      }
      .reactdiv {
        display: flex;
        align-items: center;
        gap: 15px
      }

      button {
        background-color: #4d21c9;
        color: white;
        font-weight: bolder;
        border-radius: 15px;
        height: 70px;
        margin-top: 20px;
        font-size: 22px;
      }

      .reaction {
        background-color: #fff2f2;
      }
      .memo {
        background-color: #FFFFF2;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="secondhalf">
        <div class="firsthalf">
          <h2 class="yourresult">Your Result</h2>
          <div class="svsx">
            <div class="svsx2">
              <h2>76</h2>
              <p>Of 100</p>
            </div>
          </div>

          <h2 class="Great">Great</h2>

          <p class="perf">
            Your performance exceed 65% of the people conducting test here!
          </p>
        </div>
        <div class="flexer">
          <h2 class="summary">Summary</h2>

          <div>
            <div class="bar reaction">
              <div class="reactdiv">
                <img src="./assets/images/icon-reaction.svg" alt="" />
                <p>Reaction</p>
              </div>
              <div>
                <p><b>80</b>/100</p>
              </div>
            </div>
            <div class="bar">
              <img src="./assets/images/icon-memory.svg" alt="" />
              <p>Memory</p>
              <p><b>92</b>/100</p>
            </div>
            <div class="bar">
              <img src="./assets/images/icon-verbal.svg" alt="" />
              <p>Verbal</p>
              <p><b>61</b>/100</p>
            </div>
            <div class="bar">
              <img src="./assets/images/icon-visual.svg" alt="" />
              <p>Visual</p>
              <p><b>73</b>/100</p>
            </div>
          </div>
          <button>Continue</button>
        </div>
      </div>
    </div>
  </body>
</html>
