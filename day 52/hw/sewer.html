<!DOCTYPE html>
<html>
<head>
    <title>Ticket Store</title>

    <style>
        body {
            background-color: #1a0f2b;
            color: white;
            text-align: center;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
        }

        h1 {
            color: white;
            text-shadow:
                0px 0px 10px white,
                0px 0px 10px white,
                0px 0px 10px white;
        }

        nav {
            margin-bottom: 30px;
            text-shadow:
                0px 0px 10px white,
                0px 0px 10px white,
                0px 0px 10px white;
        }

        nav a {
            color: #d1b3ff;
            margin: 0 10px;
        }

        article {
            background-color: #2b1647;
            padding: 15px;
            border-radius: 8px;
            color: white;
        }

        article img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 4px;
        }

        article h3 {
            margin: 15px 0;
        }

        .price {
            color: #d1b3ff;
            font-weight: bold;
            margin-bottom: 15px;
        }

        button {
            padding: 8px 15px;
            background: #9d4edd;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
            width: 100%;
        }

        button:hover {
            background-color: #7b2cbf;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Tickets !!!</h1>

            <nav>
                <a href="profile.html">My Profile</a>
                <a href="login.html">Login</a>
                <a href="register.html">Register</a>
                <a href="home.html">Home</a>
            </nav>
        </header>

        <main>
            <article>

                <a href="sewer.html">
                    <img src="source/sewerslvt.png" alt="Sewerslvt">
                </a>

                <h3>Live Tour Pass</h3>

                <div class="price">
                    $45.00
                </div>

                <a href="info.html">
                    <button>Buy Ticket</button>
                </a>

            </article>
        </main>

    </div>

</body>
</html>
