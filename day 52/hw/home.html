<!doctype html>
<html>
  <head>
    <title>Store</title>

    <style>
      body {
        background: linear-gradient(90deg , purple , black);
        color: white;
        font-family: Arial, sans-serif;
        margin: 0;
        position: relative;
        min-height: 100vh;
      }

      header {
        position: absolute;
        top: 20px;
        left: 0;
        width: 100%;
        text-align: center;
      }

      header h1 {
        margin: 0 0 20px 0;
        text-shadow:
        0px 0px 10px white,
        0px 0px 10px white,
        0px 0px 10px white;
      }

      nav {
        position: absolute;
        top: 55px;
        left: 0;
        width: 100%;
       text-shadow:
        0px 0px 10px white,
        0px 0px 10px white,
        0px 0px 10px white;
      }
      

      nav a {
        color: #d1b3ff;
        margin: 0 15px;
        text-decoration: none;
      }

      nav a:hover {
        color: white;
      }

      main {
        position: absolute;
        top: 160px;
        left: 50%;
        transform: translateX(-50%);
        width: 850px;
        height: 850px;
      }

      section {
        position: relative;
        width: 100%;
        height: 400px;
      }

      article {
        position: absolute;
        top: 0;
        background-color: #f0f0f0;
        padding: 15px;
        width: 250px;
        height: 380px;
        border-radius: 8px;
        color: black;
      }

      section article:nth-child(1) {
        left: 0;
      }

      section article:nth-child(2) {
        left: 300px;
      }

      section article:nth-child(3) {
        left: 600px;
      }

      .anthrax-card {
        top: 420px;
        left: 300px;
      }

      article img {
        width: 100%;
        height: 200px;
        object-fit: cover;
        border-radius: 4px;
      }

      section article:nth-child(3) img {
        object-fit: contain;
        display: block;
        margin: auto;
      }

      article h3 {
        margin: 15px 0;
      }

      .price {
        color: #5a2e91;
        font-weight: bold;
        margin-bottom: 15px;
      }

      button {
        padding: 8px 15px;
        background: #9d4edd;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 4px;
        font-weight: bold;
        width: 100%;
      }

      .info-button {
        margin-top: 8px;
      }

      button:hover {
        background-color: #7b2cbf;
      }

      footer {
        position: absolute;
        top: 1050px;
        left: 0;
        width: 100%;
        padding: 20px;
        border-top: 1px solid #555;
        text-align: center;
      }
    </style>
