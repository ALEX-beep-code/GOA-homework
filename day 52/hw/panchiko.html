<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login - Panchiko Tickets</title>

    <style>
        body {
            background-color: rgb(56, 56, 56);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            padding-top: 50px;
        }

        form {
            display: inline-block;
            text-align: left;
            background-color: rgb(40, 40, 40);
            padding: 30px;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        input[type="password"] {
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: white;
            color: black;
            border: none;
            cursor: pointer;
        }

        div {
            margin-top: 20px;
        }

        a {
            color: lightblue;
        }

        .home {
            display: inline-block;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h1>Welcome Back</h1>
    <p>Log in to your account</p>

    <form>

        <label>Username:</label><br>
        <input type="text"><br>

        <label>Password:</label><br>
        <input type="password"><br>

        <button type="submit">Login</button>

    </form>

    <div>
        <a href="register.html">Don't have an account? Register</a><br>

        <a href="home.html" class="home">Back to Home</a>
    </div>

</body>
</html>
