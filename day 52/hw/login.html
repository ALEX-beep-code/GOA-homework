<!doctype html>
<html lang="en">
  <head>
    <title>Login - Panchiko Tickets</title>
  </head>
  <body
    style="
      background-color: rgb(56, 56, 56);
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
      padding-top: 50px;
    "
  >
    <h1>Welcome Back</h1>
    <p>Log in to your account</p>

    <form
      style="
        display: inline-block;
        text-align: left;
        background-color: rgb(40, 40, 40);
        padding: 30px;
        border-radius: 8px;
      "
    >
      <label>Username:</label><br />
      <input
        type="text"
        style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px"
      /><br />

      <label>Password:</label><br />
      <input
        type="password"
        style="width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 20px"
      /><br />

      <button
        type="submit"
        style="
          width: 100%;
          padding: 10px;
          font-size: 16px;
          background-color: white;
          color: black;
          border: none;
          cursor: pointer;
        "
      >
        Login
      </button>
    </form>

    <div style="margin-top: 20px">
      <a href="register.html" style="color: lightblue"
        >Don't have an account? Register</a
      ><br />
      <a
        href="home.html"
        style="color: lightblue; display: inline-block; margin-top: 10px"
        >Back to Home</a
      >
    </div>
  </body>
</html>
