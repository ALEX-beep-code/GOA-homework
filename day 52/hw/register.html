<!DOCTYPE html>
<html lang="en">
<head>
    <title>Register - Panchiko Tickets</title>

    <style>
        body {
            background-color: rgb(56, 56, 56);
            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
            padding-top: 50px;
        }

        form {
            display: inline-block;
            text-align: left;
            background-color: rgb(40, 40, 40);
            padding: 30px;
            border-radius: 8px;
        }

        label {
            display: inline-block;
            margin-bottom: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        input[type="file"] {
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            background-color: white;
            color: black;
            border: none;
            cursor: pointer;
        }

        .links {
            margin-top: 20px;
        }

        a {
            color: lightblue;
        }

        .login-link {
            margin-left: 20px;
        }
    </style>
</head>

<body>

    <h1>Create an Account</h1>
    <p>Sign up to buy tickets</p>

    <form action="home.html" method="post">

        <label for="username">Username:</label><br>
        <input
            type="text"
            id="username"
            name="username"
            value=""
            placeholder="Enter your username"
            required
        ><br>

        <label for="password">Password:</label><br>
        <input
            type="password"
            id="password"
            name="password"
            value=""
            placeholder="Enter your password"
            required
        ><br>

        <label for="pfp">Profile Picture (pfp):</label><br>
        <input
            type="file"
            id="pfp"
            name="profile_picture"
            value=""
        ><br>

        <button type="submit" name="register" value="Register">
            Register
        </button>

    </form>

    <div class="links">
        <a href="home.html">Back to Home</a>

        <a href="login.html" class="login-link">
            Already have an account? Login
        </a>
    </div>

</body>
</html>
