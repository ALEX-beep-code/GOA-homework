<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            padding-top: 50px;
        }
        .parent {
            border: red 6px solid;
            width: 200px;
            height: 200px;
        }
        .child {
            background-color: rgb(180, 180, 255);
            transform: rotate(45deg);
            width: 200px;
            height: 200px;
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child"></div>
    </div>
</body>
</html>
