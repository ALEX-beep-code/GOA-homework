<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0;
            margin: 0;
        }
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 50px;
        }
        .parent {
            height: 200px;
            width: 200px;
            background-color: rgb(255, 255, 212);
            border: brown 5px solid;
        }
        .child1 {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 200px;
            height: 200px;
            background-color: rgb(237, 168, 40);
            transform: translate(50px , 50px);
        }
        .child2 {
            width: 50px;
            height: 50px;
            background-color: white;
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <div class="parent">
        <div class="child1">
            <div class="child2"></div>
        </div>
    </div>
</body>
</html>
