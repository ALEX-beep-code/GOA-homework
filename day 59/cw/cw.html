<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Display</title>

    <style>
        .block {
            display: block;
            width: 300px;
            height: 100px;
            margin: 20px;
            padding: 20px;
            border: 3px solid red;
            background-color: lightcoral;
            text-align: center;
        }

        .inline {
            display: inline;
            width: 300px;
            height: 100px;
            margin: 20px;
            padding: 20px;
            border: 3px solid blue;
            background-color: lightblue;
        }

        .inline-block {
            display: inline-block;
            width: 300px;
            height: 100px;
            margin: 20px;
            padding: 20px;
            border: 3px solid green;
            background-color: lightgreen;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="block">Block</div>

    <div class="inline">Inline</div>

    <div class="inline-block">Inline Block</div>

</body>
</html>
