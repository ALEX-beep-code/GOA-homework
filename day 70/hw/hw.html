
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hw</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .parent {
            background-color: orange;
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 400px;
            height: 400px;
            align-items: center;
            margin-top: 20px;
            justify-content: center;
        }

        .div1, .div2, .div3, .div4 {
            background-color: #df4be8;
            width: 220px;
            height: 80px;
            border: 5px solid purple;
            box-sizing: border-box;
        }

        .div4 {
            position: absolute;
            left: 650px;
            bottom: 540px;
        }
    </style>
</head>
<body>

    <div class="parent">
        <div class="div1">Child 01</div>
        <div class="div2">Child 02</div>
        <div class="div3">Child 03</div>
        <div class="div4">Child 04</div>
    </div>

</body>
</html>
