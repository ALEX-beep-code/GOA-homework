<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 70px;
        }
        img {
            width: 200px;
            height: 200px;
            border-radius: 0px;
            transform: rotate(0deg);
            animation-name: aleqsandre;
            animation-duration: 9s;
        }
        @keyframes aleqsandre{
            from  { height: 200px; width: 200px; transform: rotate(0deg); border-radius: 0px;}
            to { height: 400px; width: 400px; transform: rotate(90deg); border-radius: 20px;}
        }
    </style>
</head>
<body>
    <img src="./assets/dog.jfif" alt="dog">
</body>
</html>
