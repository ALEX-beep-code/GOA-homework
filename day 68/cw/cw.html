<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cops</title>
    <style>


        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-color: rgb(215, 237, 255);
            background-image: url("images/pattern-background-desktop.svg");
            background-repeat: no-repeat;
            background-size: cover;
        }

        .card {
            margin-top: 5%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: rgb(255, 255, 255);
            border-radius: 19px;
            width: 25%;
        }

        .img {
            width: 100%;
            border-top-left-radius: 19px;
            border-top-right-radius: 19px;
        }

        h1 {
            margin-top: 40px;
            align-self: center;
            font-weight: bold;
            font-size: 36px;
            margin-bottom: 20px;
        }

        .positioner {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .desc {
            margin-left: 35px;
            margin-right: 35px;
            margin-bottom: 40px;
            color: gray;
            text-align: center;
        }

        .musicone {
            background-color: #e8ecff;
            display: flex;
            width: 80%;
            height: 80px;
            justify-content: center;
            align-items: center;
            border-radius: 15px;
            padding-left: 15px;

            
        }

        .annual {
            color: gray;
            padding-bottom: 10px;

        }

        .musinc {
            margin-right: 10px;
        }

        .change {
            margin-left: 40px;
            margin-right: 20px;
            font-weight: bold;
        }

        .pay {
            background-color: rgb(64, 0, 255);
            width: 85%;
            color: white;
            height: 40px;
            border-radius: 10px;
            margin-top: 22px;
            box-shadow: 
            0px 5px 8px gray
        }

        .cancel {
            margin-top: 15px;
            margin-bottom: 30px;
            color: gray;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="positioner">
    <div class="card">

        <div class="hero">
            <img class="img" src="./images/illustration-hero.svg" alt="Music illustration">
        </div>

            <h1>Order Summary</h1>

            <p class="desc">
                You can now listen to millions of songs,
                audiobooks, and podcasts on any device
                anywhere you like!
            </p>

            <div class="musicone">
                    <img class="musinc" src="./images/icon-music.svg" alt="">
                <div class="annuals">
                    <h3>Annual Plan</h3>
                    <p>$59.99/year</p>
                </div>
                    <a class="change" href="#">Change</a>
            </div>
            <button class="pay">Proceed to Payment</button>
            <p class="cancel">Cancel Order</p>


    </div>
    </div>
</body>
</html>
</body>
</html>
