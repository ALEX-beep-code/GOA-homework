<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #ul1 li:nth-child(odd) {
            color: red;
        }
        #ul2 li:nth-child(odd) {
            color: blue;
        }
        div p:last-child {
            color: yellow;
        }
        div p:first-child {
            color: yellow;
        }
        #ol1 {
            list-style-position: inside;
            list-style: georgian;
        }
        #ul3 {
            list-style: square;
        }
    </style>
</head>
<body>
    <ul id="ul1">
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
        <li>item4</li>
        <li>item5</li>
        <li>item6</li>
        <li>item7</li>
    </ul>
    <ul id="ul2">
        <li>item1</li>
        <li>item2</li>
        <li>item3</li>
        <li>item4</li>
        <li>item5</li>
        <li>item6</li>
        <li>item7</li>
    </ul>
    <div>
        <p>p1</p>
        <p>p2</p>
        <p>p3</p>
        <p>p4</p>
        <p>p5</p>
    </div>
    <ol id="ol1">
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
    </ol>
    <ul id="ul3">
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
        <li>item</li>
    </ul>
</body>
</html>
