<html>
  <head>
    <title>CSS</title>
    <style>
      div {
        color: red;
      }
    </style>
  </head>
  <body>
    <!--1) ახსენით რა არის Inheritance (მემკვიდრეობა) CSS-ში. მოიყვანეთ მაგალითი.-->
    <!--Inheritence ქართულად ითარგმნება როგორ მემკვიდრეობა. მემკვიდრეობა ხდება როცა მშობელი ელემენტი თავის თვისებეს მაგალითად ფერს შვილ თეგს გადასცემს-->
    <!--2) შექმენით div.
   - მიანიჭეთ color: red;
   - შიგნით დაამატეთ h1 და p
   - დააკვირდით როგორ გადაეცემა ფერი შვილ ელემენტებს-->
    <div>
      <h1>Internal</h1>  <!--Inheritence!-->
      <p>CSS</p>
    </div>
  </body>
</html>
