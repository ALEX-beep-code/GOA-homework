<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ul :nth-child(even) {
            color: red;
            background-color: blue;
        }
        ul :nth-child(odd) {
            color: rgb(187, 0, 255);
            background-color: rgb(30, 30, 131);
        }
        ul :last-child {
            color:  pink;
            background-color: brown;
        }
        ul :first-child {
            color:  rgb(107, 18, 33);
            background-color: rgb(42, 165, 42);
        }
    </style>
</head>
<body>
    <ul>
        <li>first</li>
        <li>second</li>
        <li>third</li>
        <li>fourth</li>
        <li>fifth</li>
        <li>sixth</li>
        <li>seventh</li>
        <li>eighth</li>
    </ul>
</body>
</html>
